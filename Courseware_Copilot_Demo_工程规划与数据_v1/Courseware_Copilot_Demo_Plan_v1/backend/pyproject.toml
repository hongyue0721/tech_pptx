[project]
name = "courseware-copilot-backend"
version = "0.1.0"
description = "Courseware Copilot backend: courseware_core domain + courseware_api HTTP entry"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.8,<3.0",
    "uvicorn>=0.30,<1.0",
    "httpx>=0.27,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9.0",
    "jsonschema>=4.22,<5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.uv]
package = false
